<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Income report | VetZone VetCare System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><main class="vz-page-template" id="vz-static-page">
<div class="stat-grid" id="income-stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
<section class="card"><div class="report-head"><div class="tabs" role="tablist" aria-label="Report period"><button type="button" role="tab" data-mode="daily" aria-selected="true">Daily</button><button type="button" role="tab" data-mode="weekly" aria-selected="false">Weekly</button><button type="button" role="tab" data-mode="monthly" aria-selected="false">Monthly</button></div>
<button type="button" class="btn btn-ghost no-print" id="print"><span data-icon="print" class="vz-icon-placeholder"></span> Print report</button></div>
<p class="caption" id="income-description"></p>
<div class="table-wrap" style="margin-top:12px"><table class="table"><caption class="sr-only" id="income-table-caption">Daily income report</caption><thead><tr><th scope="col">Period</th><th scope="col" class="num">Sales</th><th scope="col" class="num">Items sold</th><th scope="col" class="num">Gross sales</th><th scope="col" class="num">Discounts</th><th scope="col" class="num">Net income</th><th scope="col" class="num">Cash</th><th scope="col" class="num">Online</th></tr></thead><tbody id="income-rows"></tbody><tfoot id="income-total"></tfoot></table></div></section></main></div>
<noscript>This system needs JavaScript to run. Please turn it on in your browser.</noscript>
<script src="js/app.js"></script>
<script src="js/income.js"></script>
</body>
</html>
