<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="img/favicon.png" rel="icon" type="image/png"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Inventory | VetZone VetCare System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="css/styles.css" rel="stylesheet"/>
</head>
<body>
<div data-static-page="inventory" id="app"><main class="vz-page-template" id="vz-static-page"><div class="stat-grid" id="inv-stats"></div><div id="proposals"></div><div aria-label="Inventory views" class="inventory-view-tabs status-tabs no-print" role="tablist"><button aria-controls="inv-table-region" aria-selected="true" data-view="active" id="inv-active-tab" role="tab" type="button">Active Items</button><button aria-controls="inv-table-region" aria-selected="false" data-view="archived" id="inv-archived-tab" role="tab" type="button">Archived Items</button></div><div class="toolbar no-print"><label class="search"><span class="vz-icon-placeholder" data-icon="search" data-size="18"></span><span class="sr-only">Search items</span><input id="q" placeholder="Search item name or code" type="search" value=""/></label><label><span class="sr-only">Category</span><select class="select" id="cat"><option value="All">All categories</option><option>Pet Food</option><option>Medicine</option><option>Vaccine</option><option>Grooming</option><option>Supply</option><option>Accessories</option></select></label><label><span class="sr-only">Status</span><select class="select" id="status"><option value="All">All statuses</option><option value="in">In stock</option><option value="low">Low stock</option><option value="expiring">Expiring or expired</option><option value="out">Out of stock</option></select></label><label><span class="sr-only">Sort by</span><select class="select" id="sort"><option value="name">Name A-Z</option><option value="name-desc">Name Z-A</option><option value="qty">Lowest stock first</option><option value="expiry">Soonest expiry first</option><option value="price">Highest price first</option></select></label><button class="btn" id="add-item" type="button"><span class="vz-icon-placeholder" data-icon="plus" data-size="18"></span> Add item</button></div><div aria-labelledby="inv-active-tab" id="inv-table-region" role="tabpanel"><div class="table-wrap"><table class="table"><caption class="sr-only">Official inventory</caption><thead><tr><th scope="col">Item code</th><th scope="col">Item</th><th scope="col">Category</th><th class="num" scope="col">Price</th><th class="num" scope="col">In stock</th><th scope="col">Next expiry</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div class="table-foot"><span id="showing"></span><div class="pager" id="pager"></div></div></div></main></div>
<noscript>This system needs JavaScript to run. Please turn it on in your browser.</noscript>
<script src="js/app.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
