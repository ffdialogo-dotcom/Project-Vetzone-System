<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet profile | VetZone VetCare System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>
<template id="vz-static-page">
<a class="back" href="pets.html"><span data-icon="back"></span> Back to pet records</a>
<div class="profile"><section class="card profile-card">
<div id="pet-avatar" class="big"></div><button type="button" class="btn btn-ghost btn-sm" id="change-pet-photo">Change picture</button>
<h2 id="pet-name"></h2><p id="pet-state"></p><p class="caption" id="pet-owner"></p>
<div class="pet-location-panel"><small>Confinement status</small><div id="pet-clinic-status"></div><button type="button" class="btn btn-ghost btn-sm" id="pet-clinic-actions">Clinic actions</button></div>
<div id="pet-facts"></div>
<div class="pet-care-section"><label class="field"><span>Treatment status</span><select class="select" id="pet-status"><option>Healthy</option><option>In Treatment</option><option value="Deceased" disabled>Deceased</option></select></label><div id="pet-due-note"></div></div>
<button type="button" class="btn btn-ghost btn-block" id="pet-more-actions">Pet actions</button>
<div id="pet-release-details"></div><div id="pet-deceased-details"></div><div id="pet-death-requests"></div>
<div hidden><button type="button" id="release-pet">Release pet home</button><button type="button" id="request-deceased">Request deceased status</button></div></section>
<div style="display:grid;gap:18px;min-width:0"><div id="pet-waiting"></div>
<section class="card"><div class="card-head"><h2>Visit history</h2><div class="compact-actions"><button type="button" class="btn btn-sm btn-ghost" id="missed-checkup">Record missed checkup</button><button type="button" class="btn btn-sm" id="add-visit"><span data-icon="plus" data-size="16"></span> Add visit record</button></div></div><div id="pet-visits"></div></section>
<section class="card"><div class="card-head"><h2>Vaccination history</h2><div class="compact-actions"><button type="button" class="btn btn-sm btn-ghost" id="missed-vaccination">Record missed vaccination</button><button type="button" class="btn btn-sm btn-ghost" id="add-rec"><span data-icon="plus" data-size="16"></span> Add vaccination</button></div></div><div id="pet-vaccinations"></div></section></div></div>
</template>
<noscript>This system needs JavaScript to run. Please turn it on in your browser.</noscript>
<script src="js/app.js"></script>
<script src="js/workflow-data.js"></script>
<script src="js/workflow-ui.js"></script>
<script src="js/pet.js"></script>
</body>
</html>
