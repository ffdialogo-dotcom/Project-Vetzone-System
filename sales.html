<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="img/favicon.png" rel="icon" type="image/png"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Record sales | VetZone VetCare System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="css/styles.css" rel="stylesheet"/>
</head>
<body>
<div data-static-page="sales" id="app"><main class="vz-page-template" id="vz-static-page"><div class="status-tabs workflow-tabs" role="tablist" aria-label="Sales views"><button type="button" data-sales-tab="record" role="tab" aria-selected="true">Record sale</button><button type="button" data-sales-tab="history" role="tab" aria-selected="false">History</button><button type="button" data-sales-tab="services" role="tab" aria-selected="false" id="service-admin-tab">Service prices</button></div><section id="sales-record-panel"><div class="pos"><section aria-label="Items for sale"><div class="toolbar"><label class="search"><span class="vz-icon-placeholder" data-icon="search" data-size="18"></span><span class="sr-only">Search items</span><input id="q" placeholder="Search item name or code" type="search"/></label></div><div class="range catalog-toggle" role="group" aria-label="Billing catalog"><button type="button" data-catalog="products" aria-pressed="true">Products</button><button type="button" data-catalog="services" aria-pressed="false">Services</button></div><div aria-label="Category" class="chip-row" id="cats" role="group"></div><div class="product-grid" id="grid"></div></section><aside aria-label="Current order" class="card order"><h2>Current order <span class="chip chip-grey" id="count">0 items</span></h2><div id="cart-wrap"></div><form id="pay-form" novalidate=""><fieldset><legend>Payment method</legend><label class="radio"><input name="method" type="radio" value="Cash"/> Cash</label><label class="radio"><input name="method" type="radio" value="Online payment"/> Online payment</label><small class="hint caption">Online payment only marks how the customer paid. The system does not process payments.</small></fieldset><div class="totals"><div><span>Subtotal</span><b id="sub"></b></div><div><label for="disc">Discount (%)</label><input class="input" id="disc" inputmode="decimal" max="100" min="0" placeholder="0" step="0.01" type="number"/></div><div><span>Discount amount</span><span id="disc-amt"></span></div><div class="grand"><span>Total</span><span id="total"></span></div></div><div class="form-error" hidden="" id="pay-error" role="alert" style="margin-top:10px"></div><button class="btn btn-block" id="pay-btn" style="margin-top:12px" type="submit">Review sale</button></form></aside></div></section><section class="card" id="sales-secondary-panel" hidden></section></main></div>
<noscript>This system needs JavaScript to run. Please turn it on in your browser.</noscript>
<script src="js/app.js"></script>
<script src="js/workflow-data.js"></script>
<script src="js/workflow-ui.js"></script>
<script src="js/sales.js"></script>
</body>
</html>
